# Author: Alex Gordon
# Last revision: 3-29-26
# Include everything in printer.cfg and below

[gcode_macro SMART_PERIPHERAL_VARS]
# !!!!! MODIFY THESE VARIABLES FOR YOUR PRINTER !!!!!

variable_cam_x: 10.0
variable_cam_y: 300.0
variable_cam_z: 50.0            
variable_travel_speed: 150      
variable_z_hop: 5.0             

variable_bucket_x: 20.0
variable_bucket_y: -25.0
variable_brush_start_x: 160.0
variable_brush_end_x: 180.0
variable_brush_y: -8.0
variable_brush_z: 4.0           
variable_brush_wipes: 5         
variable_silicone_y: -60.0      
variable_safe_exit_x: 50.0      

# --- Logic loop variables (do not change current_attempts) ---
# --- Larger N = more reliable; Smaller N = faster
variable_max_attempts: 3        # N times to attempt autonomous recovery
variable_current_attempts: 0    
gcode:
    # filler stuff, intentionally blank. macros fill this automatically.

# ======================================================================
# EXECUTION COMMAND
# ======================================================================

[gcode_shell_command ai_blob_checker]
command: python3 ~/scripts/auto-blob-detect.py
timeout: 15.0
verbose: True

# ======================================================================
# ENTRY POINT
# ======================================================================

[gcode_macro CHECK_NOZZLE_STATE]
description: Entry point. Parks toolhead, pauses SD card, triggers script
gcode:
    {% set vars = printer["gcode_macro SMART_PERIPHERAL_VARS"] %}
    {% set speed = vars.travel_speed * 60 %}
    
    SET_GCODE_VARIABLE MACRO=SMART_PERIPHERAL_VARS VARIABLE=current_attempts VALUE=0
    
    {% if not printer.pause_resume.is_paused %}
        PAUSE 
    {% endif %}
    
    G91 
    G0 Z{vars.z_hop} F600
    G90 
    G0 X{vars.cam_x} Y{vars.cam_y} Z{vars.cam_z} F{speed}
    M400 

    M118 AI Nozzle Inspection Initiated...
    RUN_SHELL_COMMAND CMD=ai_blob_checker

# ======================================================================
# STATE MACHINE BRANCHES (Triggered dynamically by Python)
# ======================================================================

[gcode_macro AI_STATE_CLEAN]
description: Safe state confirmed, resume print.
gcode:
    M118 ESPCAMLOG: CLEAN. Resuming Print.
    RESUME

[gcode_macro AI_STATE_EXTRUDED]
description: Execute a single Silicone Wipe.
gcode:
    {% set vars = printer["gcode_macro SMART_PERIPHERAL_VARS"] %}
    {% set speed = vars.travel_speed * 60 %}
    {% set attempts = vars.current_attempts %}
    
    {% if attempts < vars.max_attempts %}
        SET_GCODE_VARIABLE MACRO=SMART_PERIPHERAL_VARS VARIABLE=current_attempts VALUE={attempts + 1}
        M118 ESPCAMLOG: EXTRUDED (Attempt {attempts + 1}/{vars.max_attempts}). Wiping...
        
        G0 X{vars.bucket_x} Y{vars.bucket_y} F{speed}
        G1 Y{vars.silicone_y} F12000
        G1 X{vars.safe_exit_x} F1200
        G1 Y{vars.bucket_y} F1200
        
        G0 X{vars.cam_x} Y{vars.cam_y} Z{vars.cam_z} F{speed}
        M400
        RUN_SHELL_COMMAND CMD=ai_blob_checker
    {% else %}
        M118 MAX AI CLEANING ATTEMPTS REACHED. Printer remains paused.
    {% endif %}

[gcode_macro AI_STATE_BLOB]
description: Execute full Wipe -> Brush -> Wipe.
gcode:
    {% set vars = printer["gcode_macro SMART_PERIPHERAL_VARS"] %}
    {% set speed = vars.travel_speed * 60 %}
    {% set attempts = vars.current_attempts %}
    
    {% if attempts < vars.max_attempts %}
        SET_GCODE_VARIABLE MACRO=SMART_PERIPHERAL_VARS VARIABLE=current_attempts VALUE={attempts + 1}
        M118 ESPCAMLOG: BLOB (Attempt {attempts + 1}/{vars.max_attempts}). Initiating Full Recovery...
        
        G0 X{vars.bucket_x} Y{vars.bucket_y} F{speed}
        G1 Y{vars.silicone_y} F12000
        
        G0 X{vars.brush_start_x} Y{vars.brush_y} F{speed}
        G0 Z{vars.brush_z} F1000
        {% for wipes in range(vars.brush_wipes) %}
            G1 X{vars.brush_end_x} F12000
            G1 X{vars.brush_start_x} F12000
        {% endfor %}
        G0 Z{vars.brush_z + 5} F3000
        
        G0 X{vars.bucket_x} Y{vars.bucket_y} F{speed}
        G1 Y{vars.silicone_y} F12000
        G1 X{vars.safe_exit_x} F1200
        G1 Y{vars.bucket_y} F1200
        
        G0 X{vars.cam_x} Y{vars.cam_y} Z{vars.cam_z} F{speed}
        M400
        RUN_SHELL_COMMAND CMD=ai_blob_checker
    {% else %}
        M118 MAX AI CLEANING ATTEMPTS REACHED. Printer remains paused.
    {% endif %}